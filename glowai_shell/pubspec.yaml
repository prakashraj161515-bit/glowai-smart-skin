name: glowai_shell
description: "Cream — AI Skin Care & Scanner. Native shell hosting the Next.js web app inside a WebView with a 2-way native bridge."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView with first-class JS <-> native bridge
  flutter_inappwebview: ^6.1.5

  # Firebase (analytics + push)
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6

  # In-app purchases / subscriptions
  qonversion_flutter: ^11.7.0

  # Native Google Sign-In (avoids Google's WebView OAuth block)
  google_sign_in: ^6.2.1

  # Native capabilities
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # Play ringtone previews from bundled assets (settings screen)
  audioplayers: ^6.1.0

  # Persist the chosen ringtone so it applies to ALL notifications
  shared_preferences: ^2.3.2

  # Schedule reminders at specific clock-times (for sleep/quiet hours)
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Keep a foreground service alive so the water reminder fires on EVERY device
  # even when locked / app closed / swiped away (Doze + OEM proof).
  flutter_foreground_task: ^8.10.0

  # Open OEM auto-start / battery settings screens directly (Vivo/Oppo/Xiaomi)
  # so the user can whitelist the app in one tap instead of hunting menus.
  android_intent_plus: ^5.1.0
  device_info_plus: ^10.1.2

  # Floating instruction toast shown over the OEM auto-start screen.
  fluttertoast: ^8.2.8

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/ringtones/
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  # Use the full original artwork (peach + heart, with its shadows) as the
  # adaptive foreground so the home-screen icon looks EXACTLY like the source —
  # no extraction halo, no flattening. Background colour matches for any bleed.
  adaptive_icon_background: "#EFAE8E"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
